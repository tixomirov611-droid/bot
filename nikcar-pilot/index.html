function layout(body,title){const nav=tabs.map(([id,icon])=>`<button data-action="nav" data-page="${id}" class="${id===page?'active':''}">${icon} ${t(id)}</button>`).join('');const mobile=tabs.map(([id,icon])=>`<button data-action="nav" data-page="${id}" class="${id===page?'active':''}"><span>${icon}</span><span>${t(id)}</span></button>`).join('');return `<div class="shell"><aside class="sidebar"><div class="brand">Nik<em>Car</em><small>FLEET CONTROL</small></div><nav class="nav">${nav}</nav><div class="sidehint">${t('onlyPilot')}</div></aside><div class="workspace"><header class="top"><div class="brand">Nik<em>Car</em><small>FLEET CONTROL</small></div><div class="right">${status(me.access)} ${langControl()}</div></header><main class="main"><div class="subtitle">${t('cloudPilot')}</div><h1>${title}</h1>${body}</main></div><nav class="mobilebar">${mobile}</nav></div>`}
function carsPage(){const owner=isOwner();const list=records.cars.map(c=>`<div class="card"><div class="card-top"><div class="car-icon">🚙</div>${status(c.status)}</div><h2 style="margin-top:15px">${e(c.model)}</h2><div class="small">${e(c.plate)} · ${e(c.year||'')}</div><div class="rate">${money(c.daily_rate)} <span class="small">/ ${lang==='uk'?'доба':'day'}</span></div>${canApply()&&c.status==='free'?`<button class="btn full" data-action="choose-car" data-id="${e(c.id)}">${t('apply')}</button>`:''}</div>`).join('');const add=owner?`<div class="card" style="margin-top:19px"><h2>${t('newCar')}</h2><form class="form" id="new-car"><div class="row stack"><label class="field" style="flex:1">${t('model')}<input name="model" required minlength="2" maxlength="120"></label><label class="field" style="flex:1">${t('plate')}<input name="plate" required maxlength="20"></label></div><div class="row stack"><label class="field" style="flex:1">${t('year')}<input name="year" type="number" min="1990" max="2100"></label><label class="field" style="flex:1">${t('rate')}<input name="rate" type="number" step="0.01" min="1" required></label></div><button class="btn" type="submit">${t('saveCar')}</button></form></div>`:'';return `<p>${t('registerInfo')}</p><div class="cards">${list||`<div class="card">${t('noCars')}</div>`}</div>${add}`}
function docFor(kind,driver,car=null){return records.driver_documents.find(d=>d.kind===kind&&d.driver_id===driver&&(kind==='rental_contract'?d.car_id===car:d.car_id===null));}
function docRequiredTypes(){return ['passport_1','passport_2','passport_3','tax_id','rental_contract'];}
function hasLocalDocs(car){return docRequiredTypes().every(kind=>!!docFor(kind,me.id,kind==='rental_contract'?car:null));}
function uploadItem(kind,driver,car=null){const doc=docFor(kind,driver,car);const val=kind==='rental_contract'&&!car?`<div class="small">${t('selectFirst')}</div>`:'';
 const own=me?.id===driver;
 return `<div class="line"><div style="min-width:0"><b>${e(t(kind))}</b><div class="small">${doc?`${t('docsDone')} · ${d(doc.created_at)}`:t('docsWaiting')}</div>${val}</div><div class="actions">${doc?`<button type="button" class="btn secondary tiny" data-action="open-doc" data-id="${e(doc.id)}">${t('openDocument')}</button>`:''}${own&&(!['rental_contract'].includes(kind)||car)?`<label class="btn secondary tiny" style="cursor:pointer">${t('upload')}<input type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden data-doc-kind="${kind}" data-car="${car||''}" /></label>`:''}</div></div>`;}
function documentsPage(){if(isOwner()){
 const profiles=records.profiles.filter(p=>p.role==='driver');
 const lines=profiles.map(p=>{const docs=records.driver_documents.filter(d=>d.driver_id===p.id);return `<div class="card"><h2>${e(p.full_name||'—')}</h2><div class="small">${e(p.phone||'')} · ${e(p.access||'')}</div>${docs.length?docs.map(d=>`<div class="line"><div>${e(t(d.kind))}${d.car_id?` <span class="small">· ${e(carName(d.car_id))}</span>`:''}</div><button class="btn secondary tiny" data-action="open-doc" data-id="${e(d.id)}">${t('openDocument')}</button></div>`).join(''):`<p>${t('docsWaiting')}</p>`}</div>`;}).join('');return `<div class="banner warning">${t('docOwnerNote')}</div><div class="cards">${lines||`<div class="card">${t('empty')}</div>`}</div>`;
 }
 if(!me||me.role!=='driver')return '';
 const car=records.cars.find(c=>c.id===selectedCar);
 const available=records.cars.filter(c=>c.status==='free');
 const carOptions=available.map(c=>`<option value="${e(c.id)}" ${selectedCar===c.id?'selected':''}>${e(c.model)} · ${e(c.plate)}</option>`).join('');
 const ready=!!car&&hasLocalDocs(car.id);
 return `<div class="banner warning">${t('docsInfo')}</div><div class="banner">🔐 ${t('docsPrivacy')}</div><div class="card"><h2>${t('selectedCar')}</h2><label class="field">${t('chooseCar')}<select id="document-car"><option value="">${t('selectFirst')}</option>${carOptions}</select></label><div class="small" style="margin-top:9px">${car?`${e(car.model)} · ${e(car.plate)} · ${money(car.daily_rate)}`:''}</div></div><div class="card"><h2>${t('docsTitle')}</h2>${docRequiredTypes().map(kind=>uploadItem(kind,me.id,kind==='rental_contract'?selectedCar:null)).join('')}<p class="note" style="margin-top:15px">${t('docLimit')}</p></div><div class="card"><button class="btn full" data-action="submit-doc-choice" ${ready?'':'disabled'}>${t('submitCar')}</button><p>${ready?t('docsDone'):t('docsMissing')}</p></div>`;
}
function requestsPage(){const rows=records.rental_requests.map(r=>`<div class="line"><div><b>${e(carName(r.car_id))}</b><div class="small">${e(name(r.driver_id))} · ${d(r.created_at)}</div><div style="margin-top:5px">${status(r.status)}</div></div><div class="actions">${isOwner()&&r.status==='pending'?`<button class="btn tiny" data-action="approve-request" data-id="${r.id}">${t('approve')}</button><button class="btn secondary tiny" data-action="reject-request" data-id="${r.id}">${t('reject')}</button>`:''}${r.driver_id===me.id&&r.status==='pending'?`<button class="btn secondary tiny" data-action="cancel-request" data-id="${r.id}">${t('cancel')}</button>`:''}</div></div>`).join('');return `<div class="banner warning">${t('requestInfo')}</div><div class="card">${rows||t('noRequests')}</div>`}
function chatPage(){if(!activeMember())return `<div class="banner warning">${t('notApproved')}</div>`;const lines=records.chat_messages.map(m=>`<div class="bubble ${m.sender_id===me.id?'mine':''}"><small>${e(name(m.sender_id))} · ${d(m.created_at)}</small><p>${e(m.body)}</p></div>`).join('');return `<p>${t('chatInfo')}</p><div class="card"><div class="chatbox" id="messages">${lines||`<span class="small">${t('noChat')}</span>`}</div><form id="chat-send" class="row" style="align-items:stretch"><input name="text" aria-label="${t('message')}" maxlength="2000" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px" required><button class="btn" type="submit">${t('send')}</button></form></div>`}
function sosPage(){if(!activeMember())return `<div class="banner warning">${t('notApproved')}</div>`;const form=!isOwner()?`<div class="card" style="margin-bottom:15px"><form id="sos-create" class="form"><label class="field">${t('sosType')}<select name="category">${['jump_start','tow','wheel','other'].map(v=>`<option value="${v}">${t(v)}</option>`).join('')}</select></label><label class="field">${t('location')}<input name="location" maxlength="200"></label><label class="field">${t('description')}<textarea name="note" maxlength="1000"></textarea></label><button class="btn" type="submit">${t('createSos')}</button></form></div>`:'';const list=records.sos_requests.map(s=>{const claim=s.status==='open'&&s.requester_id!==me.id&&!isOwner();const release=s.status==='claimed'&&s.helper_id===me.id;const cancel=s.status==='open'&&s.requester_id===me.id;return `<div class="line"><div><b>${e(t(s.category))}</b><div class="small">${e(name(s.requester_id))} · ${d(s.created_at)}</div><p>${e(s.location_text||'')} ${e(s.note||'')}</p>${status(s.status)} ${s.helper_id?`<span class="small">${t('helper')}: ${e(name(s.helper_id))}</span>`:''}</div><div class="actions">${claim?`<button class="btn tiny" data-action="claim-sos" data-id="${s.id}">${t('claim')}</button>`:''}${release?`<button class="btn secondary tiny" data-action="release-sos" data-id="${s.id}">${t('release')}</button><button class="btn tiny" data-action="finish-sos" data-id="${s.id}">${t('complete')}</button>`:''}${cancel?`<button class="btn secondary tiny" data-action="cancel-sos" data-id="${s.id}">${t('cancelSos')}</button>`:''}</div></div>`}).join('');return `<p>${t('sosInfo')}</p>${form}<div class="card">${list||t('noSos')}</div>`}
function accountPage(){return `<div class="cards account-grid"><div class="card"><h2>${t('accountState')}</h2><div class="line"><span>${t('role')}</span>${status(me.role)}</div><div class="line"><span>${t('access')}</span>${status(me.access)}</div><form class="form" id="profile-update" style="margin-top:14px"><label class="field">${t('fullname')}<input name="fullname" maxlength="150" value="${e(me.full_name)}"></label><label class="field">${t('phone')}<input name="phone" maxlength="40" value="${e(me.phone||'')}"></label><button class="btn" type="submit">${t('saveProfile')}</button></form></div><div class="card"><h2>${t('account')}</h2><p>${e(user.email||'')}</p><p>${t('deleteNotice')}</p><p class="banner warning">${t('noPayments')}</p><button class="btn secondary" data-action="signout">${t('signout')}</button></div></div>`}
function render(){document.documentElement.lang=lang;if(!configured){root.innerHTML=configuredPage();return;}if(!sb){root.innerHTML='<div class="loading">NikCar · Cloud Pilot</div>';return;}if(!user){root.innerHTML=authPage();return;}if(!me){root.innerHTML=`<div class="auth-layout"><div class="auth-box"><h1>${t('notFound')}</h1><button class="btn" data-action="refresh">${t('reload')}</button><button class="btn secondary" data-action="signout">${t('signout')}</button></div></div>`;return;}const titles={cars:t('cars'),requests:t('requestTitle'),documents:isOwner()?t('docOwnerView'):t('docsTitle'),chat:t('chatTitle'),sos:t('sosTitle'),account:t('account')};const b={cars:carsPage,requests:requestsPage,documents:documentsPage,chat:chatPage,sos:sosPage,account:accountPage};root.innerHTML=layout(b[page](),titles[page]);if(page==='chat'){const el=document.getElementById('messages');if(el)el.scrollTop=el.scrollHeight;}}
async function load(){if(!sb||!user){me=null;render();return;}try{const {data, error}=await sb.from('profiles').select('id,user_id,full_name,phone,role,access,created_at').eq('user_id',user.id).maybeSingle();if(error)throw error;me=data;if(me){const targets=[sb.from('cars').select('*').order('model'),sb.from('rental_requests').select('*').order('created_at',{ascending:false}).limit(150),sb.from('chat_messages').select('*').order('created_at',{ascending:true}).limit(100),sb.from('sos_requests').select('*').order('created_at',{ascending:false}).limit(100),sb.from('profiles').select('id,full_name,phone,role,access'),sb.from('driver_documents').select('id,driver_id,car_id,kind,object_path,created_at')];const data=await Promise.all(targets);for(let i=0;i<data.length;i++){if(data[i].error)throw data[i].error;records[['cars','rental_requests','chat_messages','sos_requests','profiles','driver_documents'][i]]=data[i].data||[];}}render();}catch(err){toast(`${t('systemError')}: ${err.message||err}`);render();}}
async function mutation(promise,success){const {error,data}=await promise;if(error){toast(error.message);return;}if(Array.isArray(data)&&data.length===0){toast(lang==='uk'?'Заявка вже змінена іншим водієм. Оновлюємо статус.':'This request was already changed by someone else. Refreshing.');await load();return;}toast(success||'OK');await load();}
async function clickAction(btn){const a=btn.dataset.action,id=btn.dataset.id;if(a==='nav'){page=btn.dataset.page;render();window.scrollTo(0,0);return;}if(a==='auth-mode'){mode=btn.dataset.value;render();return;}if(a==='refresh'){await load();return;}if(a==='signout'){await sb.auth.signOut();user=null;me=null;render();return;}if(a==='oauth'){try{const redirectTo=location.origin+location.pathname;const {error}=await sb.auth.signInWithOAuth({provider:btn.dataset.provider,options:{redirectTo}});if(error)throw error;}catch(err){toast(err.message||err)}return;}if(!sb||!me)return;
 if(a==='choose-car'){selectedCar=id;page='documents';render();window.scrollTo(0,0);return;}
 if(a==='submit-doc-choice'){if(!selectedCar||!hasLocalDocs(selectedCar)){toast(t('docsMissing'));return;}return mutation(sb.from('rental_requests').insert({car_id:selectedCar,driver_id:me.id}),t('pending'));}
 if(a==='open-doc'){const doc=records.driver_documents.find(d=>d.id===id);if(!doc)return;const tab=window.open('about:blank','_blank');try{const {data,error}=await sb.storage.from('nikcar-driver-docs').createSignedUrl(doc.object_path,60);if(error)throw error;if(tab){tab.opener=null;tab.location.replace(data.signedUrl);}else toast(lang==='uk'?'Дозвольте відкриття нового вікна для фото':'Allow pop-ups to view the photo');}catch(err){if(tab)tab.close();toast(err.message||String(err));}return;}
 if(a==='approve-request'||a==='reject-request'){return mutation(sb.from('rental_requests').update({status:a==='approve-request'?'approved':'rejected'}).eq('id',id).eq('status','pending').select(),t(a==='approve-request'?'approved':'rejected'));}
 if(a==='cancel-request'){return mutation(sb.from('rental_requests').update({status:'cancelled'}).eq('id',id).eq('status','pending').eq('driver_id',me.id).select(),t('cancelled'));}
 const r=records.sos_requests.find(x=>x.id===id);if(!r)return;
 if(a==='claim-sos'){return mutation(sb.from('sos_requests').update({status:'claimed',helper_id:me.id}).eq('id',id).eq('status','open').is('helper_id',null).select(),t('claimed'));}
 if(a==='release-sos'){return mutation(sb.from('sos_requests').update({status:'open',helper_id:null,resolved_at:null}).eq('id',id).eq('status','claimed').eq('helper_id',me.id).select(),t('open'));}
 if(a==='finish-sos'){return mutation(sb.from('sos_requests').update({status:'resolved',resolved_at:new Date().toISOString()}).eq('id',id).eq('status','claimed').eq('helper_id',me.id).select(),t('resolved'));}
 if(a==='cancel-sos'){return mutation(sb.from('sos_requests').update({status:'cancelled'}).eq('id',id).eq('status','open').eq('requester_id',me.id).select(),t('cancelled'));}
}
document.addEventListener('click',evt=>{const b=evt.target.closest('button[data-action]');if(b)clickAction(b).catch(err=>toast(err.message||err));});
document.addEventListener('change',async evt=>{
 const f=evt.target;
 if(f.id==='document-car'){selectedCar=f.value||null;render();return;}
 if(!f.matches('input[type="file"][data-doc-kind]'))return;
 const file=f.files?.[0],kind=f.dataset.docKind,car=f.dataset.car||null;
 if(!file||docBusy)return;
 if(!me||me.role!=='driver'||!canApply()){toast(t('notApproved'));return;}
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>6291456||file.size===0){toast(t('docLimit'));return;}
 if(kind==='rental_contract'&&!car){toast(t('selectFirst'));return;}
 const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
 const fileId=crypto.randomUUID();
 const path=`${user.id}/${kind}/${kind==='rental_contract'?car+'/':''}${fileId}.${ext}`;
 docBusy=true; f.disabled=true;
 try{
   const {error:uploadError}=await sb.storage.from('nikcar-driver-docs').upload(path,file,{cacheControl:'0',upsert:false,contentType:file.type});
   if(uploadError)throw uploadError;
   const old=docFor(kind,me.id,kind==='rental_contract'?car:null);
   const query=old?sb.from('driver_documents').update({object_path:path}).eq('id',old.id):sb.from('driver_documents').insert({driver_id:me.id,car_id:kind==='rental_contract'?car:null,kind,object_path:path});
   const {error:saveError}=await query;
   if(saveError)throw saveError;
   toast(t('docUploadDone'));await load();
 }catch(error){toast(error.message||String(error));}
 finally{docBusy=false;f.disabled=false;}
});
document.addEventListener('change',evt=>{if(evt.target.matches('select[data-action="language"]')){lang=evt.target.value==='en'?'en':'uk';localStorage.setItem('nikcar-lang',lang);render();}});
document.addEventListener('submit',async evt=>{const form=evt.target;if(!['auth-form','new-car','chat-send','sos-create','profile-update'].includes(form.id))return;evt.preventDefault();const f=new FormData(form);try{
 if(form.id==='auth-form'){const email=String(f.get('email')||'').trim(),password=String(f.get('password')||'');if(mode==='reset'){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;toast(t('emailSent'));return;}if(mode==='signup'){const {error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name:String(f.get('fullname')||'').trim()}}});if(error)throw error;toast(t('authWait'));return;}const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;toast('OK');return;}
 if(form.id==='new-car'){await mutation(sb.from('cars').insert({plate:String(f.get('plate')).trim().toUpperCase(),model:String(f.get('model')).trim(),year:f.get('year')?Number(f.get('year')):null,daily_rate:Number(f.get('rate'))}));return;}
 if(form.id==='chat-send'){await mutation(sb.from('chat_messages').insert({sender_id:me.id,body:String(f.get('text')).trim()}));return;}
 if(form.id==='sos-create'){await mutation(sb.from('sos_requests').insert({requester_id:me.id,category:f.get('category'),note:String(f.get('note')||'').trim(),location_text:String(f.get('location')||'').trim()}));return;}
 if(form.id==='profile-update'){await mutation(sb.from('profiles').update({full_name:String(f.get('fullname')||'').trim(),phone:String(f.get('phone')||'').trim()}).eq('id',me.id));return;}
 }catch(err){toast(err.message||err)}});
(async()=>{if(!configured){render();return;}try{const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=mod.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session},error}=await sb.auth.getSession();if(error)throw error;user=session?.user||null;await load();sb.auth.onAuthStateChange((_event,s)=>{user=s?.user||null;setTimeout(()=>load(),0);});for(const table of ['chat_messages','sos_requests','rental_requests'])sb.channel(`nikcar-${table}`).on('postgres_changes',{event:'*',schema:'public',table},()=>{if(user)load();}).subscribe();}catch(err){root.innerHTML=`<div class="auth-layout"><div class="auth-box"><h1>${t('systemError')}</h1><p>${e(err.message||err)}</p></div></div>`;}})();
</script></body></html>
