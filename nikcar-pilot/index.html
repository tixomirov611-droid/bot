 <meta name="theme-color" content="#101116">
 <script>
  // Apply saved preference before the stylesheet paints, avoiding a bright flash.
  try {
   if (localStorage.getItem('nikcar-theme') !== 'light') {
    document.documentElement.dataset.theme='dark';
    document.querySelector('meta[name="theme-color"]').setAttribute('content','#101116');
   } else document.documentElement.dataset.theme='light';
  } catch (_) { document.documentElement.dataset.theme='dark'; }
 </script>
