name: NikCar Native Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/nikcar-native-android.yml'
permissions:
  contents: read
jobs:
  native-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR" || { echo 'sdkmanager missing'; exit 1; }
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile real native NikCar Android app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: android-native
      - name: Verify APK signature, package, and SDK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E '^package:|^sdkVersion:|^targetSdkVersion:'
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then echo 'Unexpected embedded web app'; exit 1; fi
        working-directory: android-native
      - name: Upload native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NikCar-Native-v1-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30