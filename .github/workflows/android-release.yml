name: Android APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-release/**'
      - '.github/workflows/android-release.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK and AAB
        working-directory: android-release
        run: |
          gradle --version || true
          gradle :app:assembleDebug :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NikCar-Android-APK-AAB
          path: |
            android-release/app/build/outputs/apk/debug/*.apk
            android-release/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
